<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="deepRiver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="riverWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#deepRiver)"/>

  <!-- Morning Mist / Clouds -->
  <path d="M0 450 Q480 380 960 420 T1920 400 L1920 600 L0 600 Z" fill="#ecfdf5" opacity="0.08"/>
  <path d="M0 520 Q480 470 960 500 T1920 490 L1920 700 L0 700 Z" fill="#ecfdf5" opacity="0.12"/>

  <!-- Hills & Forests -->
