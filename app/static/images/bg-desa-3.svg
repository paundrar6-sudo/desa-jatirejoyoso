  <path d="M0 710 Q500 600 1000 680 T1920 660 L1920 1080 L0 1080 Z" fill="#047857"/>

  <!-- Meandering River through Village -->
  <path d="M780 710 C820 780, 890 840, 750 920 C620 990, 820 1040, 950 1080 L1150 1080 C1020 1020, 900 970, 980 910 C1060 840, 950 780, 890 710 Z" fill="url(#riverWater)"/>

  <!-- Stones & Riverside greenery -->
  <ellipse cx="650" cy="940" rx="90" ry="45" fill="#334155"/>
  <ellipse cx="1080" cy="980" rx="110" ry="50" fill="#475569"/>
  <ellipse cx="940" cy="910" rx="50" ry="25" fill="#1e293b"/>

  <!-- Forest Foliage foreground -->
  <circle cx="150" cy="980" r="240" fill="#022c22"/>
  <circle cx="320" cy="1020" r="180" fill="#064e3b"/>
  <circle cx="1800" cy="980" r="260" fill="#022c22"/>
  <circle cx="1600" cy="1020" r="190" fill="#064e3b"/>
</svg>

