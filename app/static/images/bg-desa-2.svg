<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyEvening" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="35%" stop-color="#1f2937"/>
      <stop offset="70%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2a4365"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#skyEvening)"/>

  <!-- Distant Hill Line -->
  <path d="M0 680 Q500 590 1000 640 T1920 620 L1920 1080 L0 1080 Z" fill="#132438"/>

  <!-- Village Hall (Pendopo Balai Desa) Architecture Silhouette -->
  <!-- Main Joglo / Limasan Roof Top -->
  <polygon points="960,340 760,520 1160,520" fill="url(#roofGrad)"/>
  <!-- Middle Tier Roof -->
  <polygon points="960,460 640,650 1280,650" fill="#9a3412"/>
  <!-- Lower Tier Roof -->
  <polygon points="960,580 500,750 1420,750" fill="#7c2d12"/>

  <!-- Pillars (Tiang Saka Pendopo) -->
  <rect x="620" y="750" width="28" height="230" fill="#451a03"/>
  <rect x="800" y="750" width="28" height="230" fill="#451a03"/>
  <rect x="1092" y="750" width="28" height="230" fill="#451a03"/>
  <rect x="1272" y="750" width="28" height="230" fill="#451a03"/>

  <!-- Pendopo Floor & Base -->
  <polygon points="420,980 1500,980 1580,1080 340,1080" fill="#1e293b"/>
  <rect x="460" y="960" width="1000" height="20" fill="#334155"/>

  <!-- Warm Lantern Lights Inside Balai Desa -->
  <circle cx="960" cy="730" r="140" fill="url(#lampGlow)"/>
  <circle cx="960" cy="730" r="16" fill="#fffbeb"/>

  <circle cx="710" cy="770" r="90" fill="url(#lampGlow)"/>
  <circle cx="710" cy="770" r="10" fill="#fffbeb"/>

  <circle cx="1210" cy="770" r="90" fill="url(#lampGlow)"/>
  <circle cx="1210" cy="770" r="10" fill="#fffbeb"/>

  <!-- Lush Foliage & Trees around Balai Desa -->
  <circle cx="280" cy="780" r="180" fill="#064e3b" opacity="0.9"/>
  <circle cx="380" cy="840" r="140" fill="#065f46" opacity="0.85"/>
  <circle cx="1640" cy="780" r="180" fill="#064e3b" opacity="0.9"/>
  <circle cx="1540" cy="840" r="140" fill="#065f46" opacity="0.85"/>

  <!-- Ground Grass -->
  <rect y="980" width="1920" height="100" fill="#0f172a"/>
</svg>

